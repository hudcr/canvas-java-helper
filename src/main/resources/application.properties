spring.application.name=canvas-java-helper
server.port=8080

spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:file:./data/canvasdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Canvas settings
canvas.baseUrl=${CANVAS_BASE_URL:https://YOUR_SCHOOL.instructure.com}
canvas.accessToken=${CANVAS_ACCESS_TOKEN:PUT_YOUR_CANVAS_TOKEN_HERE}

# OpenAI settings
openai.baseUrl=https://api.openai.com/v1
openai.apiKey=${OPENAI_API_KEY:PUT_YOUR_OPENAI_KEY_HERE}
openai.chatModel=gpt-4.1-mini
openai.embeddingModel=text-embedding-3-large

# App settings
app.topK=10
app.syncHours=6
